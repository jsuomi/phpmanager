# documentation.

# This workflow will build, test, sign and package a WPF or Windows Forms desktop application
# built on .NET Core.
# To learn how to migrate your existing application to .NET Core,
# refer to https://docs.microsoft.com/en-us/dotnet/desktop-wpf/migration/convert-project-from-net-framework
#
# To configure this workflow:
#
# 1. Configure environment variables
# GitHub sets default environment variables for every workflow run.
# Replace the variables relative to your project in the "env" section below.
#
# 2. Signing
# Generate a signing certificate in the Windows Application
# Packaging Project or add an existing signing certificate to the project.
# Next, use PowerShell to encode the .pfx file using Base64 encoding
# by running the following Powershell script to generate the output string:
#
# $pfx_cert = Get-Content '.\SigningCertificate.pfx' -Encoding Byte
# [System.Convert]::ToBase64String($pfx_cert) | Out-File 'SigningCertificate_Encoded.txt'
#
# Open the output file, SigningCertificate_Encoded.txt, and copy the
# string inside. Then, add the string to the repo as a GitHub secret
# and name it "Base64_Encoded_Pfx."
# For more information on how to configure your signing certificate for
# this workflow, refer to https://github.com/microsoft/github-actions-for-desktop-apps#signing
#
# Finally, add the signing certificate password to the repo as a secret and name it "Pfx_Key".
# See "Build the Windows Application Packaging project" below to see how the secret is used.
#
# For more information on GitHub Actions, refer to https://github.com/features/actions
# For a complete CI/CD sample to get started with GitHub Action workflows for Desktop Applications,
# refer to https://github.com/microsoft/github-actions-for-desktop-apps

name: Build MSI

# Manual runs cancel each other. Tag runs make releases, so they are never cancelled.
concurrency:
    group: msi-build-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

on:
    # Pushing a tag such as v2.14.0 builds it and creates a draft release.
    # The tag must match AssemblyFileVersion in SharedAssembyInfo.cs.
    push:
        tags: ["v*"]
    workflow_dispatch:
        inputs:
            tag:
                description: "Version to build, such as 2.13.0 or v2.13.0. Empty keeps the version in source."
                required: false
                type: string

permissions:
    contents: write

jobs:
    build:
        runs-on: windows-2022

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Resolve version
              id: version
              env:
                  EVENT: ${{ github.event_name }}
                  REF_NAME: ${{ github.ref_name }}
                  INPUT_TAG: ${{ inputs.tag }}
              run: |
                  $path = 'SharedAssembyInfo.cs'
                  $text = [IO.File]::ReadAllText($path)
                  $m = [regex]::Match($text, '(?m)^\[assembly: AssemblyFileVersion\("([^"]*)"\)\]')
                  if (-not $m.Success) { throw "AssemblyFileVersion not found in $path." }
                  $source = $m.Groups[1].Value

                  $tag = if ($env:EVENT -eq 'push') { $env:REF_NAME } else { $env:INPUT_TAG }
                  if ($tag) {
                      $t = [regex]::Match($tag, '^v?(\d+\.\d+\.\d+(\.\d+)?)$')
                      if (-not $t.Success) { throw "'$tag' is not a version such as v2.14.0." }
                      $full = $t.Groups[1].Value
                      if (-not $t.Groups[2].Success) { $full = "$full.0" }

                      if ($env:EVENT -eq 'push') {
                          if ($full -ne $source) { throw "Tag $tag does not match AssemblyFileVersion $source in $path. Bump $path, then tag that commit." }
                      } else {
                          $text = [regex]::Replace($text, '(?m)^(\[assembly: Assembly(?:File)?Version\(")[^"]*("\)\])', '${1}' + $full + '${2}')
                          [IO.File]::WriteAllText($path, $text, [Text.UTF8Encoding]::new($true))
                          Write-Host "Stamped $path with $full for this run."
                      }
                  } else {
                      $full = $source
                  }

                  $name = $full -replace '\.0$', ''
                  Write-Host "Building version $name."
                  "version=$name" >> $env:GITHUB_OUTPUT

            - name: Install IIS Manager
              run: |
                  Install-WindowsFeature -name Web-Server -IncludeManagementTools

            - name: Build everything and verify
              run: |
                  ./dist.release.bat

            - name: Package
              env:
                  VERSION: ${{ steps.version.outputs.version }}
              run: |
                  $v = $env:VERSION
                  New-Item -ItemType Directory -Path dist -Force | Out-Null
                  Copy-Item PHPManagerForIIS_x86.msi "dist/PHPManagerForIIS-${v}-x86.msi"
                  Copy-Item PHPManagerForIIS_x64.msi "dist/PHPManagerForIIS-${v}-x64.msi"

                  $sums = Get-ChildItem dist -File | Sort-Object Name | ForEach-Object {
                      "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
                  }
                  [IO.File]::WriteAllText("$PWD/dist/SHA256SUMS.txt", ($sums -join "`n") + "`n")
                  Get-Content dist/SHA256SUMS.txt

            # Downloads as PHPManagerForIIS-<version>.zip.
            - name: Upload MSI files
              uses: actions/upload-artifact@v7
              with:
                  name: PHPManagerForIIS-${{ steps.version.outputs.version }}
                  if-no-files-found: error
                  path: |
                      dist/*.msi
                      dist/SHA256SUMS.txt

            # Creates the draft, or refreshes its files when a tag run is re-run.
            # A published release is left alone.
            - name: Create draft release
              if: github.event_name == 'push'
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  TAG: ${{ github.ref_name }}
                  VERSION: ${{ steps.version.outputs.version }}
              run: |
                  $files = (Get-ChildItem dist -File).FullName
                  $draft = gh release view $env:TAG --json isDraft --jq .isDraft 2>$null
                  if ($LASTEXITCODE -ne 0) {
                      gh release create $env:TAG --draft --verify-tag --generate-notes --title "PHP Manager for IIS $env:VERSION" $files
                  } elseif ($draft -eq 'true') {
                      gh release upload $env:TAG --clobber $files
                  } else {
                      throw "Release $env:TAG is already published. Its files were not changed."
                  }
