name: Force cancel run

on:
    workflow_dispatch:
        inputs:
            run_id:
                description: "Run id to force-cancel. The number at the end of the Actions run URL."
                required: true
                type: string

permissions:
    actions: write

jobs:
    force-cancel:
        runs-on: ubuntu-latest
        steps:
            - name: Force cancel
              env:
                  RUN_ID: ${{ inputs.run_id }}
              run: |
                  case "$RUN_ID" in
                      ''|*[!0-9]*)
                          echo "Run id must be a number."
                          exit 1
                          ;;
                  esac
                  gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/force-cancel"
