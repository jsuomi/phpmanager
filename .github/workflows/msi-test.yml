name: Test MSI

# Installs the x64 MSI from a Build MSI run on a clean Windows runner. For each
# PHP branch that php.net still supports and windows.php.net has a build of,
# it registers that PHP with New-PHPVersion, serves a page through IIS, then
# uninstalls the MSI. One more job does the same with the newest PHP as an
# upgrade: it installs the newest published release older than the build,
# registers PHP with it, then installs the build over it.
# The x86 MSI is not tested: it refuses to install on 64-bit Windows.
run-name: Test MSI from ${{ github.event.workflow_run.display_title || format('run {0}', inputs.run_id) }}

on:
    workflow_run:
        workflows: ["Build MSI"]
        types: [completed]
    workflow_dispatch:
        inputs:
            run_id:
                description: "Build MSI run id to test. The number at the end of the Actions run URL."
                required: true
                type: string

permissions:
    contents: read
    actions: read

jobs:
    prepare:
        if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
        runs-on: ubuntu-24.04
        outputs:
            run_id: ${{ steps.run.outputs.run_id }}
            branches: ${{ steps.php.outputs.branches }}
            latest: ${{ steps.php.outputs.latest }}
        steps:
            - name: Resolve run
              id: run
              env:
                  RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
              run: |
                  case "$RUN_ID" in
                      ''|*[!0-9]*)
                          echo "Run id must be a number."
                          exit 1
                          ;;
                  esac
                  echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

            # Supported means php.net's security support has not ended.
            - name: List supported PHP branches
              id: php
              run: |
                  supported=$(curl -fsSL --retry 3 https://www.php.net/releases/branches.php \
                      | jq -c --arg today "$(date -u +%F)" \
                          '[.[] | select((.security_support_end // "")[0:10] >= $today) | .branch]')
                  windows=$(curl -fsSL --retry 3 https://downloads.php.net/~windows/releases/releases.json \
                      | jq -c '[keys[] | select(test("^[0-9]+\\.[0-9]+$"))]')
                  branches=$(jq -nc --argjson s "$supported" --argjson w "$windows" '[$s[] | select(IN($w[]))] | sort_by(split(".") | map(tonumber))')
                  missing=$(jq -nc --argjson s "$supported" --argjson w "$windows" '[$s[] | select(IN($w[]) | not)]')
                  if [ "$missing" != "[]" ]; then
                      echo "::warning::Supported PHP with no Windows build to test: $missing"
                  fi
                  if [ "$branches" = "[]" ] || [ -z "$branches" ]; then
                      echo "No supported PHP branch has a Windows build."
                      exit 1
                  fi
                  echo "Testing PHP $branches"
                  echo "branches=$branches" >> "$GITHUB_OUTPUT"
                  echo "latest=$(jq -nr --argjson b "$branches" '$b[-1]')" >> "$GITHUB_OUTPUT"

    test:
        needs: prepare
        name: PHP ${{ matrix.php }}${{ matrix.upgrade && ' upgrade' || '' }}
        runs-on: windows-2022
        strategy:
            fail-fast: false
            matrix:
                php: ${{ fromJSON(needs.prepare.outputs.branches) }}
                upgrade: [false]
                # upgrade: true does not match [false], so this adds a job instead of changing one.
                include:
                    - php: ${{ needs.prepare.outputs.latest }}
                      upgrade: true
        defaults:
            run:
                # Windows PowerShell 5.1: the cmdlets ship as a snap-in, which pwsh cannot load.
                shell: powershell
        env:
            PHP_BRANCH: ${{ matrix.php }}
            PHP_DIR: C:\php
        steps:
            - name: Install IIS with CGI
              run: |
                  $result = Install-WindowsFeature -Name Web-Server, Web-CGI -IncludeManagementTools
                  if (-not $result.Success) { throw "Install-WindowsFeature failed: $($result.ExitCode)" }

            - name: Download MSI
              uses: actions/download-artifact@v8
              with:
                  pattern: PHPManagerForIIS-*
                  merge-multiple: true
                  path: msi
                  run-id: ${{ needs.prepare.outputs.run_id }}
                  github-token: ${{ github.token }}

            - name: Check SHA256SUMS
              id: msi
              run: |
                  $msi = Get-ChildItem msi -Filter '*-x64.msi' | Select-Object -First 1
                  if (-not $msi) { throw 'No x64 MSI in the artifact.' }
                  $line = Get-Content msi/SHA256SUMS.txt | Where-Object { $_ -match "  $([regex]::Escape($msi.Name))$" }
                  if (-not $line) { throw "$($msi.Name) is not in SHA256SUMS.txt." }
                  $hash = (Get-FileHash $msi.FullName -Algorithm SHA256).Hash
                  if ($hash -ne $line.Split(' ')[0]) { throw "$($msi.Name) does not match SHA256SUMS.txt." }
                  Write-Host "$($msi.Name) matches SHA256SUMS.txt."
                  # PHPManagerForIIS-2.16.0-x64.msi gives 2.16.0.
                  "version=$($msi.Name -replace '^PHPManagerForIIS-(.+)-x64\.msi$', '$1')" >> $env:GITHUB_OUTPUT

            - name: Download PHP
              id: php
              run: |
                  $ProgressPreference = 'SilentlyContinue'
                  $releases = Invoke-RestMethod https://downloads.php.net/~windows/releases/releases.json
                  $release = $releases.$env:PHP_BRANCH
                  $build = $release.PSObject.Properties | Where-Object { $_.Name -match '^nts-v[cs]\d+-x64$' } | Select-Object -First 1
                  if (-not $build) { throw "No NTS x64 build of PHP $env:PHP_BRANCH in releases.json." }
                  $zip = $build.Value.zip
                  Write-Host "Downloading $($zip.path)"
                  Invoke-WebRequest "https://downloads.php.net/~windows/releases/$($zip.path)" -OutFile php.zip -UseBasicParsing
                  if ((Get-FileHash php.zip -Algorithm SHA256).Hash -ne $zip.sha256) { throw "$($zip.path) does not match its SHA-256 in releases.json." }
                  Expand-Archive php.zip -DestinationPath $env:PHP_DIR
                  # Windows rebuilds such as 8.2.35-1 report 8.2.35 as PHP_VERSION.
                  "version=$($release.version -replace '-\d+$', '')" >> $env:GITHUB_OUTPUT

            - name: Install previous release
              id: previous
              if: matrix.upgrade
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  NEW_VERSION: ${{ steps.msi.outputs.version }}
              run: |
                  $new = [version]$env:NEW_VERSION
                  # Assign first: PowerShell 5.1 pipes a JSON array on as one object.
                  $releases = (gh release list --exclude-drafts --exclude-pre-releases --limit 100 --json tagName) -join "`n" | ConvertFrom-Json
                  if ($LASTEXITCODE -ne 0) { throw 'gh release list failed.' }
                  $previous = $releases |
                      Where-Object { $_.tagName -match '^v\d+\.\d+\.\d+(\.\d+)?$' -and [version]$_.tagName.Substring(1) -lt $new } |
                      Sort-Object { [version]$_.tagName.Substring(1) } -Descending |
                      Select-Object -First 1
                  if (-not $previous) {
                      Write-Host "::warning::No published release is older than $env:NEW_VERSION, so the upgrade job tests a fresh install instead."
                      exit 0
                  }
                  $tag = $previous.tagName
                  Write-Host "Upgrading from $tag to $env:NEW_VERSION."

                  gh release download $tag --pattern '*x64.msi' --pattern 'SHA256SUMS.txt' --dir previous
                  if ($LASTEXITCODE -ne 0) { throw "Could not download the x64 MSI of $tag." }
                  $msi = Get-ChildItem previous -Filter '*x64.msi' | Select-Object -First 1
                  if (Test-Path previous/SHA256SUMS.txt) {
                      $line = Get-Content previous/SHA256SUMS.txt | Where-Object { $_ -match "  $([regex]::Escape($msi.Name))$" }
                      if (-not $line -or (Get-FileHash $msi.FullName -Algorithm SHA256).Hash -ne $line.Split(' ')[0]) { throw "$($msi.Name) does not match the SHA256SUMS.txt of $tag." }
                  }

                  $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList '/i', "`"$($msi.FullName)`"", '/qn', '/norestart', '/l*v', "`"$PWD\previous.log`""
                  if ($p.ExitCode -notin 0, 3010) { throw "msiexec /i of $tag exited with $($p.ExitCode). See previous.log." }

                  Add-PSSnapin PHPManagerSnapin
                  New-PHPVersion -ScriptProcessor (Join-Path $env:PHP_DIR 'php-cgi.exe')
                  Get-PHPConfiguration | Format-List

                  $old = [Reflection.AssemblyName]::GetAssemblyName("$env:ProgramFiles\PHP Manager 2 for IIS\Web.Management.PHP.dll").Version
                  "OLD_ASSEMBLY_VERSION=$old" >> $env:GITHUB_ENV
                  "tag=$tag" >> $env:GITHUB_OUTPUT

            - name: Install MSI
              run: |
                  $msi = (Get-ChildItem msi -Filter '*-x64.msi' | Select-Object -First 1).FullName
                  $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList '/i', "`"$msi`"", '/qn', '/norestart', '/l*v', "`"$PWD\install.log`""
                  if ($p.ExitCode -notin 0, 3010) { throw "msiexec /i exited with $($p.ExitCode). See install.log." }

            - name: Check install
              run: |
                  foreach ($name in 'Web.Management.PHP', 'Web.Management.PHP.Client') {
                      if (-not (Test-Path "$env:windir\Microsoft.NET\assembly\GAC_*\$name")) { throw "$name is not in the GAC." }
                  }
                  $admin = [xml](Get-Content "$env:windir\System32\inetsrv\config\administration.config" -Raw)
                  if (-not $admin.SelectSingleNode("//moduleProviders/add[@name='PHP']")) { throw 'The PHP module provider is not in administration.config.' }
                  Add-PSSnapin PHPManagerSnapin
                  Get-Command -PSSnapin PHPManagerSnapin | Format-Table -AutoSize

            - name: Check upgrade
              if: steps.previous.outputs.tag != ''
              env:
                  NEW_VERSION: ${{ steps.msi.outputs.version }}
              run: |
                  $new = [Reflection.AssemblyName]::GetAssemblyName("$env:ProgramFiles\PHP Manager 2 for IIS\Web.Management.PHP.dll").Version
                  Write-Host "Assemblies went from $env:OLD_ASSEMBLY_VERSION to $new."

                  $products = @(Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*' |
                      Where-Object { $_.DisplayName -like 'PHP Manager 2 for IIS*' })
                  $products | Format-Table DisplayName, DisplayVersion -AutoSize
                  if ($products.Count -ne 1) { throw "Expected one PHP Manager in installed programs, found $($products.Count)." }
                  if (($products[0].DisplayVersion -replace '\.0$', '') -ne $env:NEW_VERSION) { throw "Installed version is $($products[0].DisplayVersion), not $env:NEW_VERSION." }

                  $gac = "$env:windir\Microsoft.NET\assembly\GAC_*\Web.Management.PHP"
                  if (-not (Test-Path "$gac\v4.0_$($new)__*\*.dll")) { throw "Web.Management.PHP $new is not in the GAC." }
                  if ("$new" -ne $env:OLD_ASSEMBLY_VERSION -and (Test-Path "$gac\v4.0_$($env:OLD_ASSEMBLY_VERSION)__*\*.dll")) { throw "Web.Management.PHP $env:OLD_ASSEMBLY_VERSION is still in the GAC." }

                  $admin = [xml](Get-Content "$env:windir\System32\inetsrv\config\administration.config" -Raw)
                  $type = $admin.SelectSingleNode("//moduleProviders/add[@name='PHP']").type
                  if ($type -notmatch "Version=$([regex]::Escape("$new")),") { throw "The PHP module provider points at another version: $type" }

                  $snapin = Get-PSSnapin -Registered -Name PHPManagerSnapin
                  if ($snapin.Version -ne $new) { throw "PHPManagerSnapin is registered as $($snapin.Version), not $new." }

            - name: Register PHP
              env:
                  PHP_VERSION: ${{ steps.php.outputs.version }}
                  UPGRADED_FROM: ${{ steps.previous.outputs.tag }}
              run: |
                  Add-PSSnapin PHPManagerSnapin
                  $exe = Join-Path $env:PHP_DIR 'php-cgi.exe'
                  # After an upgrade, PHP must still be registered from the previous release.
                  if (-not $env:UPGRADED_FROM) { New-PHPVersion -ScriptProcessor $exe }
                  $config = Get-PHPConfiguration
                  $config | Format-List
                  Get-PHPExtension -Status Enabled | Format-Table -AutoSize

                  if ($config.ScriptProcessor -ne $exe) { throw "Active PHP is $($config.ScriptProcessor), not $exe." }
                  # Version is php-cgi.exe's ProductVersion, which may end in .0.
                  if ($config.Version -notmatch "^$([regex]::Escape($env:PHP_VERSION))(\.0)?$") { throw "Active PHP version is $($config.Version), not $env:PHP_VERSION." }
                  $ini = Join-Path $env:PHP_DIR 'php.ini'
                  if (-not (Test-Path $ini)) { throw 'php.ini was not created from php.ini-production.' }
                  if ($config.PHPIniFilePath -ne $ini) { throw "php.ini in use is $($config.PHPIniFilePath), not $ini." }

            - name: Serve a page
              env:
                  PHP_VERSION: ${{ steps.php.outputs.version }}
              run: |
                  $page = @'
                  <?php
                  header('Content-Type: application/json');
                  $names = array('curl', 'gettext', 'mbstring', 'mysqli', 'openssl', 'soap', 'gd', 'xmlrpc');
                  $loaded = array();
                  foreach ($names as $name) { $loaded[$name] = extension_loaded($name); }
                  echo json_encode(array('version' => PHP_VERSION, 'sapi' => PHP_SAPI, 'ini' => php_ini_loaded_file(), 'extensions' => $loaded));
                  '@
                  Set-Content -Path C:\inetpub\wwwroot\smoke.php -Value $page -Encoding ASCII

                  try {
                      $response = Invoke-WebRequest http://localhost/smoke.php -UseBasicParsing
                  } catch {
                      throw "Request failed: $($_.Exception.Message) $($_.ErrorDetails.Message)"
                  }
                  Write-Host $response.Content
                  $data = $response.Content | ConvertFrom-Json

                  if ($data.sapi -ne 'cgi-fcgi') { throw "PHP ran as $($data.sapi), not cgi-fcgi." }
                  if ($data.version -ne $env:PHP_VERSION) { throw "PHP $($data.version) answered, not $env:PHP_VERSION." }
                  if ($data.ini -ne (Join-Path $env:PHP_DIR 'php.ini')) { throw "PHP loaded $($data.ini), not php.ini in $env:PHP_DIR." }

                  # The extensions MakeRecommendedPHPIniChanges enables. xmlrpc is only in PHP 7.
                  $expected = 'curl', 'gettext', 'mbstring', 'mysqli', 'openssl', 'soap', 'gd'
                  if ([version]$env:PHP_VERSION -lt [version]'8.0') { $expected += 'xmlrpc' }
                  $missing = $expected | Where-Object { -not $data.extensions.$_ }
                  if ($missing) { throw "Recommended extensions not loaded: $($missing -join ', ')" }

            - name: Uninstall MSI
              run: |
                  $msi = (Get-ChildItem msi -Filter '*-x64.msi' | Select-Object -First 1).FullName
                  $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList '/x', "`"$msi`"", '/qn', '/norestart', '/l*v', "`"$PWD\uninstall.log`""
                  if ($p.ExitCode -notin 0, 3010) { throw "msiexec /x exited with $($p.ExitCode). See uninstall.log." }

                  foreach ($name in 'Web.Management.PHP', 'Web.Management.PHP.Client') {
                      if (Test-Path "$env:windir\Microsoft.NET\assembly\GAC_*\$name\*\*.dll") { throw "$name is still in the GAC." }
                  }
                  $admin = [xml](Get-Content "$env:windir\System32\inetsrv\config\administration.config" -Raw)
                  if ($admin.SelectSingleNode("//moduleProviders/add[@name='PHP']")) { throw 'The PHP module provider is still in administration.config.' }
                  if (Get-PSSnapin -Registered -Name PHPManagerSnapin -ErrorAction SilentlyContinue) { throw 'PHPManagerSnapin is still registered.' }

            - name: Upload logs
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: msi-test-logs-php${{ matrix.php }}${{ matrix.upgrade && '-upgrade' || '' }}
                  if-no-files-found: ignore
                  retention-days: 7
                  path: |
                      previous.log
                      install.log
                      uninstall.log
