name: PHP versions

# Compares the knownPhpVersions rows in Server/Config/PHPConfigHelper.cs with
# php.net. A failed run means a new PHP branch needs a row or a date changed.
on:
    # Off for now: GitHub turns off schedules in public repos after 60 days
    # without commits, so a quiet repo would stop checking without notice.
    # schedule:
    #     # Mondays at 06:17 UTC.
    #     - cron: "17 6 * * 1"
    push:
        branches: [master]
        paths:
            - "Server/Config/PHPConfigHelper.cs"
            - ".github/scripts/check-php-versions.mjs"
            - ".github/workflows/php-versions.yml"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Compare with php.net
              run: node .github/scripts/check-php-versions.mjs
